function qDetail(x, k) {
  const q = x.q, en = k === 'english';
  const tagC = {c: ['c', 'נכונה'], w: ['w', 'שגויה'], t: ['t', 'מלכודת'], s: ['', 'לא נענתה']}[x.st];
  const chosen = x.a ? `<p><b>בחר:</b> (${x.a}) <span class="${en ? 'en' : ''}" style="display:inline">${q.choices[x.a - 1]}</span></p>${!x.ok ? `<div class="ins ${x.st === 't' ? 'warn' : 'bad'}"><b>למה זה שגוי</b>${q.why[x.a] || ''}</div>` : ''}` : '';
  const pas = q.passage ? `<details><summary class="muted">מבוסס על: ${PASS[q.passage].title} (להצגה)</summary><div class="${PASS[q.passage].lang === 'en' ? 'en' : ''}">${PASS[q.passage].html}</div></details>` : '';
  return `<details class="qd"><summary><b>${x.i + 1}.</b><span class="tag ${tagC[0]}">${tagC[1]}</span><span>${esc(q.type)}${q.topic && q.topic !== q.type ? ' · ' + esc(q.topic) : ''}</span><span class="tag">${LEVEL[q.level]}</span><span class="muted">${Math.round(x.t)} שנ׳${x.fast ? ' · חפוזה' : ''}${x.slow ? ' · איטית' : ''}</span></summary>
    <div class="body">${pas}<div class="${en ? 'en' : ''}"><div class="stem">${q.stem}</div>${q.fig ? `<div class="fig">${q.fig}</div>` : ''}</div>
      ${chosen}<p><b>התשובה הנכונה:</b> (${q.ans}) <span class="${en ? 'en' : ''}" style="display:inline">${q.choices[q.ans - 1]}</span></p>
      <div class="ins good"><b>הסבר</b>${q.expl}</div>${q.tip ? `<div class="ins info"><b>טיפ ללימוד</b>${q.tip}</div>` : ''}
      ${q.video ? `<p>🎬 <a href="${q.video.url}" target="_blank" rel="noopener">${esc(q.video.title)}</a> <span class="muted">(${q.video.exact ? 'הסרטון פותר את השאלה הזאת בדיוק' : 'סרטון באותו נושא'})</span></p>` : ''}</div></details>`;
}

function essayTeacher(r, an) {
  const e = an.essay.est, p = ESSAY_PROMPTS[r.essay.prompt], h = an.essay.human || {};
  const opt = (sel) => ['', 1, 2, 3, 4, 5, 6].map(v => `<option value="${v}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${v || '—'}</option>`).join('');
  const yes = b => b ? '✓' : '✗';
  return `<div class="card stack"><h2>✍️ מטלת כתיבה</h2>
    <div class="prompt" style="font-size:15px"><b>${p.title}.</b> ${p.text}</div>
    <div class="essay-text">${esc(r.essay.text) || '<span class="muted">(לא נכתב)</span>'}</div>
    <div class="grid2">
      <div><h3>הערכה אוטומטית: ${e.content} + ${e.language} = ${e.total}/12</h3>
        <dl class="kv" style="margin-top:8px"><dt>מילים</dt><dd>${e.W}</dd><dt>פסקאות</dt><dd>${e.paras}</dd><dt>אורך משפט ממוצע</dt><dd>${e.avgSent} מילים</dd>
        <dt>מילות קישור שונות</dt><dd>${e.connectors} (${e.cats} סוגים)</dd><dt>גיוון מילים</dt><dd>${e.ttr}%</dd><dt>מילות נושא</dt><dd>${e.keys}</dd>
        <dt>עמדה / נגד / דוגמה / סיכום</dt><dd>${yes(e.opinion)} ${yes(e.counter)} ${yes(e.example)} ${yes(e.conclusion)}</dd><dt>שפה לא רשמית</dt><dd>${e.informal}</dd><dt>זמן כתיבה</dt><dd>${fmtMin(r.essay.secs)}</dd>${r.essay.pasted ? `<dt>הודבק טקסט</dt><dd style="color:var(--bad-ink)">${r.essay.pasted} תווים ⚠️</dd>` : ''}</dl></div>
      <div class="stack"><h3>הציון שלך (בדיקה אנושית)</h3>
        <div class="row"><div class="field"><label>ממד התוכן (1–6)</label><select id="h-content">${opt(h.content)}</select></div>
        <div class="field"><label>ממד הלשון (1–6)</label><select id="h-language">${opt(h.language)}</select></div></div>
        <div class="row"><button class="btn primary small" data-act="save-human">שמירה ועדכון הציונים</button>${an.essay.human ? '<button class="btn small" data-act="clear-human">חזרה להערכה האוטומטית</button>' : ''}</div>
        <p class="muted">הציון שלך מחליף את ההערכה האוטומטית בכל הדוח (גם בדוח לתלמיד), ומשוקלל ב-25% מציון המילולי.</p></div>
    </div></div>`;
}

function renderTeacherHome() {
  const hist = lsGet(HIST, []);
  return `<div class="wrap stack" style="max-width:820px">
    <div class="rep-head"><h1>דוחות מורה</h1><button class="btn small" data-act="exit-teacher">יציאה</button></div>
    <div class="card stack"><h3>פתיחת דוח מקוד</h3><p class="sub">הדביקו את כל הודעת הווטסאפ של התלמיד או רק את הקוד שמתחיל ב-PSY.</p>
      <textarea id="code" class="essay-box" style="min-height:120px;font-size:14px;direction:ltr" placeholder="PSY1...."></textarea>
      <div class="row"><button class="btn primary" data-act="open-code">פתיחת הדוח</button><label class="btn">העלאת קובץ<input type="file" id="file" accept=".txt,.json" class="hide"></label></div></div>
    <div class="card"><h3>מבחנים שנעשו במחשב הזה</h3>${hist.length ? `<table class="t"><thead><tr><th>שם</th><th>תאריך</th><th>מצב</th><th></th></tr></thead><tbody>${hist.map(h => `<tr><td>${esc(h.name)}</td><td>${new Date(h.date).toLocaleDateString('he-IL')}</td><td>${h.mode === 'timed' ? 'עם זמן' : 'ללא זמן'}</td><td><button class="btn small" data-act="open-hist" data-v="${h.id}">פתיחה</button></td></tr>`).join('')}</tbody></table>` : '<p class="sub">אין עדיין.</p>'}</div>
  </div>`;
}

function withTeacherData(r) {
  const t = lsGet(TNOTES, {})[r.id];
  return t && t.human ? {...r, human: t.human} : r;
}
function afterRender() {
  reveal();
  if ($('.sticky-cta')) $('#a11y-btn')?.classList.add('has-sticky');
  if (CURRENT && $('.js-send')) refreshSend();
  const tn = $('#tnotes');
  if (tn) tn.addEventListener('input', () => { const all = lsGet(TNOTES, {}); all[CURRENT.r.id] = {...(all[CURRENT.r.id] || {}), notes: tn.value}; lsSet(TNOTES, all); });
  const f = $('#file');
  if (f) f.addEventListener('change', async () => { const txt = await f.files[0].text(); openCode(txt); });
}
function refreshSend() {
  return encodeRecord(CURRENT.r).then(code => {
    CURRENT.code = code; const href = waLink(summaryText(CURRENT.r, CURRENT.an, code));
    document.querySelectorAll('.js-send').forEach(a => a.href = href);
  });
}
async function openCode(txt) {
  try { const r = await decodeRecord(txt); view.record = withTeacherData(r); view.tab = 'teacher'; render(); }
  catch (e) { toast('הקוד לא נקרא. ודאו שהעתקתם את כולו.'); }
}

/* ───────────────────────── אירועים ───────────────────────── */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'bg' && ev.target !== el) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
  switch (act) {
    case 'start': {
      const inp = v === 'q' ? $('#name-q') : $('#name'), name = inp.value.trim();
      if (!name) { toast('נא למלא שם פרטי'); inp.focus(); return; }
      setupName = name; render(); break;
    }
    case 'setup-back': setupName = null; render(); break;
    case 'setup-go': {
      const tg = Math.round(+$('#target').value);
      S = newState({name: setupName, target: tg >= 200 && tg <= 800 ? String(tg) : '', mode: document.querySelector('input[name=mode]:checked').value, withEssay: $('#withEssay').checked});
      setupName = null; atHome = false; save(); track('start'); render(); break;
    }
    case 'resume': atHome = false; render(); break;
    case 'exit-home': save(); atHome = true; render(); window.scrollTo(0, 0); break;
    case 'pane': pane = v; render(); break;
    case 'begin': {
      const pr = document.querySelector('input[name=prompt]:checked'); if (pr) S.prompt = +pr.value;
      S.stage = 'run'; save(); render(); break;
    }
    case 'choose': { const q = SEC[curKey()].questions[S.qi]; S.ans[q.id] = S.ans[q.id] === +v ? 0 : +v; if (!S.ans[q.id]) delete S.ans[q.id]; save(); render(); break; }
    case 'go': S.qi = +v; save(); render(); break;
    case 'next': S.qi = Math.min(S.qi + 1, SEC[curKey()].questions.length - 1); save(); render(); break;
    case 'prev': S.qi = Math.max(0, S.qi - 1); save(); render(); break;
    case 'mark': { const q = SEC[curKey()].questions[S.qi]; S.marks[q.id] = !S.marks[q.id]; save(); render(); break; }
    case 'formulas': formulasModal(); break;
    case 'lead-send': sendLead(); break;
    case 'finish': askFinish(); break;
    case 'confirm-finish': finishPhase(); break;
    case 'close': case 'bg': closeModal(); break;
    case 'restart': if (confirm('להתחיל מבחן חדש? התוצאות הקודמות נשמרות במכשיר.')) { S = null; atHome = false; lsSet(STORE, null); render(); window.scrollTo(0, 0); } break;
    case 'doc': legalDoc(v); break;
    case 'theme': {
      const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = t; try { localStorage.setItem('psy_theme', t); } catch (e) {}
      document.querySelector('meta[name=theme-color]')?.setAttribute('content', t === 'light' ? '#f6f5f1' : '#111111');
      document.querySelectorAll('.theme-btn').forEach(b => b.outerHTML = themeBtn()); break;
    }
    case 'to-form': if (S && S.stage !== 'done') { atHome = false; render(); break; }
      $('#start-form')?.scrollIntoView({behavior: 'smooth', block: 'start'}); setTimeout(() => $('#name')?.focus({preventScroll: true}), 450); break;
    case 'tst': modal(`<img class="tst-big" src="${CONFIG.testimonials[+v]}" alt="המלצה ${+v + 1}"><div class="row" style="margin-top:14px;justify-content:center"><button class="btn primary" data-act="close">סגירה</button></div>`); break;
    case 'contact': contactModal(); break;
    case 'c-wa': { const t = contactText(); if (t) window.open(waLink(t), '_blank', 'noopener'); break; }
    case 'c-mail': { const t = contactText(); if (t) location.href = mailLink('פנייה מהמבחן') + '&body=' + encodeURIComponent(t); break; }
    case 'wipe':
      if (confirm('למחוק מהמכשיר את כל נתוני המבחן והדוחות?')) { try { [STORE, HIST, TNOTES, 'psy_a11y'].forEach(k => localStorage.removeItem(k)); } catch (e) {} S = null; A11Y = {f: 0}; applyA11y(); closeModal(); render(); toast('הנתונים נמחקו מהמכשיר'); }
      break;
    case 'a11y': { const pnl = $('#a11y-panel'), open = pnl.classList.toggle('hide') === false; el.setAttribute('aria-expanded', open); if (open) renderA11yPanel(); break; }
    case 'a11y-f': A11Y.f = clamp((A11Y.f || 0) + +v, 0, 2); applyA11y(); renderA11yPanel(); break;
    case 'a11y-t': A11Y[v] = !A11Y[v]; applyA11y(); renderA11yPanel(); break;
    case 'a11y-reset': A11Y = {f: 0}; applyA11y(); renderA11yPanel(); break;
    case 'teacher-login':
      modal(`<h2>כניסת מורה</h2><div class="field"><label for="pin">קוד</label><input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div class="row" style="margin-top:14px"><button class="btn primary" data-act="pin-ok">כניסה</button><button class="btn" data-act="close">ביטול</button></div>`);
      setTimeout(() => $('#pin')?.focus(), 50); break;
    case 'pin-ok':
      if (await sha256Hex($('#pin').value.trim()) === CONFIG.teacherPinHash) {
        closeModal(); view.teacher = true;
        view.record = S && S.stage === 'done' ? withTeacherData(lsGet(HIST, []).find(x => x.id === S.id) || buildRecord()) : null;
        view.tab = 'teacher'; render();
      } else toast('קוד שגוי'); break;
    case 'exit-teacher': view = {tab: 'student', teacher: false, record: null}; if (location.hash) history.replaceState(null, '', location.pathname); render(); break;
    case 'teacher-home': view.record = null; render(); break;
    case 'tab': view.tab = v; render(); window.scrollTo({top: 0}); break;
    case 'print': document.querySelectorAll('details.qd').forEach(d => d.open = true); window.print(); break;
    case 'open-code': openCode($('#code').value); break;
    case 'open-hist': { const r = lsGet(HIST, []).find(x => x.id === v); if (r) { view.record = withTeacherData(r); view.tab = 'teacher'; render(); } break; }
    case 'save-human': case 'clear-human': {
      const all = lsGet(TNOTES, {}), id = CURRENT.r.id;
      const human = act === 'save-human' ? {content: +$('#h-content').value, language: +$('#h-language').value} : null;
      if (human && (!human.content || !human.language)) { toast('יש לבחור ציון בשני הממדים'); return; }
      all[id] = {...(all[id] || {}), human}; lsSet(TNOTES, all);
      view.record = {...CURRENT.r, human}; render(); toast(human ? 'הציון נשמר והדוח עודכן' : 'חזרה להערכה האוטומטית'); break;
    }
    case 'send-wa': case 'copy-code': case 'download': {
      const {r, an} = CURRENT;
      if (act === 'send-wa' && CURRENT.code) break; // הקישור עצמו פותח את הווטסאפ
      const code = CURRENT.code || await encodeRecord(r);
      if (act === 'send-wa') window.open(waLink(summaryText(r, an, code)), '_blank', 'noopener');
      else if (act === 'copy-code') { try { await navigator.clipboard.writeText(summaryText(r, an, code)); toast('הועתק. אפשר להדביק בכל צ׳אט'); } catch (e) { modal(`<h3>העתיקו את הקוד</h3><textarea class="essay-box" style="min-height:160px;direction:ltr;font-size:13px">${esc(code)}</textarea><div class="row"><button class="btn" data-act="close">סגירה</button></div>`); } }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([summaryText(r, an, code)], {type: 'text/plain'})); a.download = 'אבחון_' + (r.name || 'תלמיד').replace(/\s+/g, '_') + '.txt'; a.click(); }
      break;
    }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'optin2' && CURRENT) {
    const on = ev.target.checked; CURRENT.r.optin = on;
    if (S && S.id === CURRENT.r.id) { S.optin = on; save(); }
    const h = lsGet(HIST, []); const rec = h.find(x => x.id === CURRENT.r.id); if (rec) { rec.optin = on; lsSet(HIST, h); }
    refreshSend(); toast(on ? 'תודה! אשלח רק דברים שימושיים' : 'עודכן');
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'essay' && S) {
    S.essay = ev.target.value;
    const wc = $('#wc'); if (wc) wc.textContent = S.essay.trim().split(/\s+/).filter(Boolean).length + ' מילים';
    save();
  }
});
document.addEventListener('paste', ev => {
  if (ev.target.id === 'essay' && S) { S.pasted = (S.pasted || 0) + (ev.clipboardData?.getData('text') || '').length; save(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modal-root').innerHTML) { closeModal(); return; }
  if (ev.key === 'Escape' && !$('#a11y-panel').classList.contains('hide')) { $('#a11y-panel').classList.add('hide'); $('#a11y-btn').setAttribute('aria-expanded', 'false'); return; }
  if (ev.key === 'Tab' && $('#modal-root').innerHTML) { // לכידת פוקוס בתוך החלון
    const f = [...$('.modal').querySelectorAll(FOCUSABLE)]; if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
    return;
  }
  if (ev.key === 'Enter' && ev.target.id === 'pin') { $('[data-act=pin-ok]')?.click(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'lead-phone') { sendLead(); return; }
  if (ev.key === 'Enter' && (ev.target.id === 'name' || ev.target.id === 'name-q')) { (ev.target.id === 'name-q' ? $('[data-act=start][data-v=q]') : $('#start-form [data-act=start]'))?.click(); return; }
  if (!S || S.stage !== 'run' || curKey() === 'essay' || $('#modal-root').innerHTML) return;
  if (['1', '2', '3', '4'].includes(ev.key)) { const q = SEC[curKey()].questions[S.qi]; S.ans[q.id] = +ev.key; save(); render(); }
  else if (ev.key === 'ArrowLeft') { S.qi = Math.min(S.qi + 1, SEC[curKey()].questions.length - 1); save(); render(); }
  else if (ev.key === 'ArrowRight') { S.qi = Math.max(0, S.qi - 1); save(); render(); }
});
document.addEventListener('visibilitychange', () => save());

function teacherFromHash() {
  if (location.hash === '#teacher' && !view.teacher) openTeacherLogin();
}
function openTeacherLogin() {
  modal(`<h2>כניסת מורה</h2><div class="field"><label for="pin">קוד</label><input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div class="row" style="margin-top:14px"><button class="btn primary" data-act="pin-ok">כניסה</button><button class="btn" data-act="close">ביטול</button></div>`);
}
window.addEventListener('hashchange', teacherFromHash);
render();
teacherFromHash();
track('visit');
</script>
</body>
</html>
