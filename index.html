.tag.c{background:var(--good-bg);border-color:var(--good-line);color:var(--good-ink)} .tag.w{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)} .tag.t{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:700}
.essay-text{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:16px;line-height:1.8;max-height:420px;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--chip);color:var(--chip-ink);padding:10px 18px;border-radius:999px;z-index:99;font-weight:700}
.hide{display:none!important}
/* ── brand & contact ── */
.brand{background:transparent}
.brand .in{max-width:1080px;margin:0 auto;padding:18px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b3bb3,#6d4fd6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.brand .who b{display:block;line-height:1.2}
.brand .who span{font-size:14px;color:var(--ink-2)}
.brand .links{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;background:transparent}
.icon-btn:hover{border-color:var(--ink-2)}
.icon-btn svg{width:16px;height:16px;flex:none}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.contact-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--surface-2);transition:border-color .15s,transform .15s}
.contact-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.contact-item .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.contact-item .ic svg{width:20px;height:20px}
.contact-item b{display:block;font-size:15px}
.contact-item .val{font-size:14px;color:var(--ink-2);direction:ltr;unicode-bidi:isolate}
.logo.photo{background-size:cover;background-position:center;border-radius:50%}
.vids{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.vid{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink);background:var(--surface-2);transition:border-color .15s,transform .15s}
.vid:hover{border-color:var(--ink);transform:translateY(-1px)}
.vid .ic{width:38px;height:38px;border-radius:10px;background:var(--chip);color:var(--chip-ink);display:flex;align-items:center;justify-content:center}
.vid .ic svg{width:18px;height:18px}
.vid b{display:block;font-size:15px}
.vid .muted{font-size:13px}
.vid .go{font-weight:800;color:var(--accent);white-space:nowrap}
.vid.exact{border-color:var(--warn-line);background:var(--warn-bg)}
.badge-exact{display:inline-block;font-size:11px;font-weight:800;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}
a.qcell{text-decoration:none;position:relative}
a.qcell::after{content:"▶";position:absolute;bottom:-4px;left:-4px;width:14px;height:14px;border-radius:50%;background:var(--chip);color:var(--chip-ink);font-size:7px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface)}
.path{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch;margin:12px 0 14px}
.path .st{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.path .st .e{font-size:20px;line-height:1}
.path .st b{display:block;font-size:14.5px;margin-top:4px}
.path .st span{font-size:13px;color:var(--ink-2)}
.path .st.now{border-color:var(--accent);background:var(--accent-soft)}
.path .ar{align-self:center;color:var(--accent);font-weight:800;font-size:20px}
/* המסלול מתאים את עצמו לרוחב הכרטיס, לא למסך */
.about .txt,.me>div{container-type:inline-size}
@container (max-width:560px){.path{grid-template-columns:1fr}.path .ar{transform:rotate(-90deg);justify-self:center;line-height:1}}
.personal{margin-top:14px}
.personal h3{margin-bottom:8px}
.personal p{color:var(--ink-2);margin:8px 0 0}
.tst{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.tst-row{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.tst-item{flex:none;border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);overflow:hidden;scroll-snap-align:start;box-shadow:var(--shadow);cursor:zoom-in}
.tst-item img{display:block;height:280px;width:auto;max-width:78vw;object-fit:cover;object-position:top}
.tst-big{display:block;max-width:100%;max-height:78vh;margin:0 auto;border-radius:12px}
.tipcard{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px 14px}
.tipcard img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.tipcard b{display:block;font-size:14px;color:var(--warn-ink)}
.journey{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.journey .pic{width:100%;height:auto;border-radius:14px;display:block} /* התמונה מוצגת במלואה — נוקי במרכז */
.journey blockquote{margin:10px 0 0;padding:10px 14px;border-inline-start:4px solid var(--accent);background:var(--surface-2);border-radius:8px;color:var(--ink);font-weight:600}
@media (max-width:760px){.journey{grid-template-columns:1fr}}
.quote-line{margin-top:12px;font-weight:700;color:var(--accent)}
.next-steps .lead{font-size:18px;color:var(--ink-2);margin:8px 0 0}
.goal-chip{display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:999px;padding:6px 14px;margin-top:12px}
.me{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.me img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--accent-soft)}
.me p{margin:0 0 10px;color:var(--ink-2)}
.me .stat{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.me .stat span{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700}
.gift{margin-top:20px;border-radius:var(--radius);padding:20px 22px;background:linear-gradient(135deg,#2f2f9e,#4b3bc0 60%,#6d4fd6);color:#fff}
.gift p{color:#e4e3fb;margin:8px 0 0}
.gift .btn.wa{background:#fff;color:#128c4a;border-color:#fff}
.gift .btn:not(.wa){background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.5)}
@media (max-width:560px){.me{grid-template-columns:1fr;justify-items:center;text-align:center}.me .stat{justify-content:center}}
.about{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.about img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--accent-soft)}
.about .txt p{margin:6px 0 0;color:var(--ink-2)}
@media (max-width:560px){.about{grid-template-columns:1fr;justify-items:center;text-align:center}}
.site-foot{text-align:center;color:var(--muted);font-size:14px;padding:24px 16px 40px}

ציאה אותם.", "4": "<b>תשובה (4) — 53<\/b> פסולה: חיברו בלי להתחשב בכפילות.", "1": "<b>תשובה (1) — 35<\/b> הוציאה את ה-6 שלוש פעמים."}, "trap": [3], "tip": "&quot;או אך לא שניהם&quot; = <b>מחסירים את החיתוך פעמיים<\/b>. ציירו שני עיגולים חופפים (ון) ומלאו מהאמצע החוצה.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7692478748955856148", "title": "שאלת אותיות: לא לנחש", "exact": false}}, {"id": "q_15", "sec": "quant", "type": "הסתברות וקומבינטוריקה", "topic": "ספירת מספרים", "level": 3, "stem": "כמה מהמספרים השלמים מ-1 עד 1,000 (כולל) מכילים את הספרה 7 לפחות פעם אחת?", "choices": ["<span class=\"ltr\">243<\/span>", "<span class=\"ltr\">271<\/span>", "<span class=\"ltr\">300<\/span>", "<span class=\"ltr\">729<\/span>"], "ans": 2, "expl": "<span class=\"ok\">תשובה (2) — 271.<\/span> קל יותר לספור את המספרים <b>בלי<\/b> 7. נכתוב כל מספר מ-0 עד 999 בשלוש ספרות (למשל 007). לכל ספרה יש 9 אפשרויות שאינן 7, ולכן <span class=\"ltr\">9 · 9 · 9 = 729<\/span> מספרים כאלה, כולל 000. בטווח 1 עד 1,000: יוצא 000, ונכנס 1,000 (שגם בו אין 7). לכן יש 729 מספרים בלי 7, ו-<span class=\"ltr\">1,000 − 729 = 271<\/span> מספרים עם 7.", "why": {"3": "<b>תשובה (3) — 300<\/b> פסולה, וזו המלכודת: &quot;100 מספרים עם 7 בכל אחד משלושת המקומות&quot;. כך מספרים כמו 77 ו-777 נספרים יותר מפעם אחת.", "1": "<b>תשובה (1) — 243<\/b> פסולה: זה מספר המספרים עם 7 <b>בדיוק פעם אחת<\/b> (<span class=\"ltr\">3 · 81<\/span>).", "4": "<b>תשובה (4) — 729<\/b> פסולה: זה מספר המספרים <b>בלי<\/b> 7."}, "trap": [3], "tip": "&quot;לפחות פעם אחת&quot; = <b>הכול פחות אף פעם<\/b>. ספירה ישירה כמעט תמיד סופרת כפול.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7692847075419000116", "title": "צירופים: מתי הסדר חשוב", "exact": false}}]}, {"key": "english", "name": "אנגלית", "short": "אנגלית", "the": "פרק האנגלית", "questions": [{"id": "e_sc1", "sec": "english", "type": "Sentence Completion", "topic": "Vocabulary", "level": 1, ct": false}}, {"id": "e_sc3", "sec": "english", "type": "Sentence Completion", "topic": "Vocabulary", "level": 2, "ans": 1, "stem": "The committee's decision to approve the controversial merger, despite widespread public opposition, was seen by critics as further proof of its ______ from the concerns of ordinary citizens.", "choices": ["alienation", "affiliation", "obligation", "admiration"], "expl": "<span dir=\"ltr\">\"despite widespread public opposition\"<\/span> מעיד שהוועדה פעלה בניגוד לרצון הציבור, כלומר ניתוק מהאזרחים: <span dir=\"ltr\">alienation<\/span>.", "why": {"2": "<span dir=\"ltr\">affiliation<\/span> = שייכות, קשר הדוק (<span dir=\"ltr\">affiliation with<\/span>), ההפך מניתוק. זו המלכודת: מילה שנראית דומה למילה הנכונה (גם היא מסתיימת ב-tion) אבל הפוכה במשמעות.", "3": "<span dir=\"ltr\">obligation<\/span> = מחויבות, לא מתאים להקשר.", "4": "<span dir=\"ltr\">admiration<\/span> = הערצה, הפוך לרוח הביקורתית."}, "trap": [2], "tip": "קבעו קודם אם המילה החסרה <b>חיובית או שלילית<\/b> לפי הטון של המשפט, ורק אז בחרו.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7683109639235374357", "title": "Sentence Completion: איך לפתור", "exact": false}}, {"id": "e_sc4", "sec": "english", "type": "Sentence Completion", "topic": "Contrast clues", "level": 2, "ans": 2, "stem": "Unlike his brother, who spent money freely on whatever caught his eye, Daniel was known for being ______, saving almost every dollar he earned.", "choices": ["generous", "frugal", "wealthy", "reckless"], "expl": "<span dir=\"ltr\">Unlike<\/span> מסמן ניגוד לאח הבזבזן, ו-<span dir=\"ltr\">\"saving almost every dollar\"<\/span> מחזק: דניאל חסכן, <span dir=\"ltr\">frugal<\/span>.", "why": {"1": "<span dir=\"ltr\">generous<\/span> (נדיב) אינו ההפך מבזבזן, ואינו קשור לחיסכון.", "3": "<span dir=\"ltr\">wealthy<\/span> (עשיר) מתקשר לכסף ולחיסכון, אבל מתאר מצב ולא התנהגות. זו המלכודת.", "4": "<span dir=\"ltr\">reckless<\/span> (פזיז) מתאר דווקא את האח."}, "trap": [3], "tip": "מילות ניגוד (<span dir=\"ltr\">unlike, although, whereas<\/span>) הופכות את הכיוון: המילה החסרה היא ההפך ממה שנאמר על הצד השני.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7683109639235374357", "title": "Sentence Completion: איך לפתור", "exact": false}}, {"id": "e_sc5", "sec": "english", "type": "Sentence Completion", "topic": "Contrast clues", "level": 2, "ans": 3, "stem": "Critics were quick to ______ the young director's debut film, dismissing it as amateurish and derivative — only to reverse their verdict entirely once it won three major festival awards.", "choices": ["extol", "scrutinize", "censure", "endorse"], "expl": "המילה צריכה להתאים ל-<span dir=\"ltr\">\"dismissing it as amateurish and derivative\"<\/span>, ביקורת שלילית חריפה: <span dir=\"ltr\">censure<\/span> (לגנות).", "why": {"1": "<span dir=\"ltr\">extol<\/span> = להלל, הפוך מהנדרש. זו המלכודת: מי שקורא רק את סוף המשפט (הפרסים) בוחר מילה חיובית.", "2": "<span dir=\"ltr\">scrutinize<\/span> = לבחון בקפידה, ניטרלי ולא שיפוטי.", "4": "<span dir=\"ltr\">endorse<\/span> = לתמוך, חיובי."}, "trap": [1], "tip": "המילה החסרה קשורה בדרך כלל לחלק <b>הצמוד<\/b> אליה במשפט. כאן: dismissing it.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7683109639235374357", "title": "Sentence Completion: איך לפתור", "exact": false}}, {"id": "e_sc6", "sec": "english", "type": "Sentence Completion", "topic": "Advanced vocabulary", "level": 3, "ans": 2, "stem": "Although the senator's speech was widely praised for its eloquence, critics noted that its argument was fundamentally ______, resting on claims that collapsed under the slightest scrutiny.", "choices": ["persuasive", "specious", "meticulous", "unassailable"], "expl": "הניגוד בין <span dir=\"ltr\">\"praised for its eloquence\"<\/span> לבין <span dir=\"ltr\">\"collapsed under the slightest scrutiny\"<\/span> מחייב טיעון שנשמע טוב אבל שגוי ביסודו: <span dir=\"ltr\">specious<\/span>.", "why": {"1": "<span dir=\"ltr\">persuasive<\/span> מתאר טיעון חזק, הפוך מ-<span dir=\"ltr\">collapsed<\/span>. זו המלכודת: המילה מתאימה ל-eloquence ולא לחלק שאחרי Although.", "3": "<span dir=\"ltr\">meticulous<\/span> = קפדני, תכונה חיובית.", "4": "<span dir=\"ltr\">unassailable<\/span> = שאי אפשר לערער עליו, הפוך לגמרי."}, "trap": [1], "tip": "<span dir=\"ltr\">Although<\/span> בתחילת המשפט = שני החלקים מנוגדים. המילה החסרה שייכת לחלק השני.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7683109639235374357", "title": "Sentence Completion: איך לפתור", "exact": false}}, {"id": "e_sc7", "sec": "english", "type": "Sentence Completion", "topic": "Logical connectors", "level": 3, "ans": 4, "stem": "The new evidence did not merely ______ the scientist's theory; it undermined the very assumptions on which the theory had been built.", "choices": ["corroborate", "inspire", "refine", "challenge"], "expl": "<span dir=\"ltr\">\"did not merely X; it Y\"<\/span> = לא רק X, אלא משהו <b>חזק יותר באותו כיוון<\/b>. החלק השני (ערער את היסודות) שלילי, ולכן X הוא פגיעה חלשה יותר: <span dir=\"ltr\">challenge<\/span> (לערער, להטיל ספק).", "why": {"1": "<span dir=\"ltr\">corroborate<\/span> = לאשש, הפוך לכיוון המשפט. זו המלכודת: נשמעת &quot;מדעית&quot; ומתאימה לראיות חדשות.", "2": "<span dir=\"ltr\">inspire<\/span> = לעורר השראה, לא מתאים לפגיעה בתאוריה.", "3": "<span dir=\"ltr\">refine<\/span> = לחדד ולשפר, חיובי ולא פוגע."}, "trap": [1], "tip": "<span dir=\"ltr\">not merely ... but / not only ... but also<\/span> מחבר שני דברים <b>באותו כיוון<\/b>, כשהשני חזק מהראשון.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7683109639235374357", "title": "Sentence Completion: איך לפתור", "exact": false}}, {"id": "e_sc8", "sec": "english", "type": "Sentence Completion", "topic": "Advanced vocabulary", "level": 3, "ans": 1, "stem": "Far from being the unequivocal endorsement the CEO had hoped for, the shareholders' lukewarm approval of the restructuring plan was, if anything, a tacit ______ of the very strategy it ostensibly ratified.", "choices": ["repudiation", "ratification", "vindication", "endorsement"], "expl": "<span dir=\"ltr\">\"Far from being X\"<\/span> שולל תמיכה מלאה, ו-<span dir=\"ltr\">\"lukewarm approval\"<\/span> מחזק: האישור הרשמי היה בעצם <b>דחייה שבשתיקה<\/b>, <span dir=\"ltr\">tacit repudiation<\/span>.", "why": {"2": "<span dir=\"ltr\">ratification<\/span> כבר מופיעה בסוף המשפט (<span dir=\"ltr\">ostensibly ratified<\/span>) וסותרת את <span dir=\"ltr\">Far from<\/span>.", "3": "<span dir=\"ltr\">vindication<\/span> = הצדקה, חיובי ולא מתאים לטון.", "4": "<span dir=\"ltr\">endorsement<\/span> היא בדיוק המילה שהמשפט פותח בשלילתה. זו המלכודת."}, "trap": [4], "tip": "<span dir=\"ltr\">Far from being X<\/span> = &quot;רחוק מלהיות X&quot;. התשובה לא יכולה להיות X או מילה נרדפת לו.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7683109639235374357", "title": "Sentence Completion: איך לפתור", "exact": false}}, {"id": "e_rs1", "sec": "english", "type": "Restatement", "topic": "Time relations", "level": 1, "ans": 3, "stem": "No sooner had the merger been announced than the company's stock price plummeted.", "choices": ["The company's stock price plummeted, which then led investors to announce the merger.", "The merger was announced only after the stock price had already plummeted.", "As soon as the merger was announced, the company's stock price immediately plummeted.", "Despite the merger announcement, the stock price remained stable for a long time."], "expl": "<span dir=\"ltr\">\"No sooner had X than Y\"<\/span> = ברגע ש-X קרה, Y קרה מיד. תשובה (3) שומרת על היחס עם <span dir=\"ltr\">\"As soon as\"<\/span>.", "why": {"1": "הופכת את כיוון הסיבתיות.", "2": "הופכת את סדר הזמנים: במקור ההודעה קדמה לקריסה. זו המלכודת.", "4": "סותרת ישירות את המקור."}, "trap": [2], "tip": "<span dir=\"ltr\">No sooner ... than<\/span> הוא מבנה שחוזר הרבה בבחינה. שננו אותו כ&quot;ברגע ש...&quot;.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7694685566603939078", "title": "Restatement: היפוך סיבה ותוצאה", "exact": false}}, {"id": "e_rs2", "sec": "english", "type": "Restatement", "topic": "Double negative", "level": 2, "ans": 2, "stem": "The committee members were not unaware of the risks involved, but they proceeded with the plan regardless.", "choices": ["The committee members were completely unaware of the risks but proceeded with the plan anyway.", "The committee members recognized the risks but decided to proceed with the plan regardless.", "The committee members were so concerned about the risks that they abandoned the plan entirely.", "The committee members were unaware of the risks until after the plan had already failed."], "expl": "<span dir=\"ltr\">\"not unaware\"<\/span> = <span dir=\"ltr\">aware<\/span>: שלילה כפולה מבטלת את עצמה. הם היו מודעים לסיכונים ובכל זאת המשיכו.", "why": {"1": "מפספסת את השלילה הכפולה ומגיעה למסקנה ההפוכה. זו המלכודת.", "3": "סותרת את <span dir=\"ltr\">\"proceeded... regardless\"<\/span>.", "4": "מוסיפה מידע שלא קיים במקור (כישלון התוכנית)."}, "trap": [1], "tip": "כשרואים <span dir=\"ltr\">not un-<\/span>, תרגמו מיד לחיוב (<span dir=\"ltr\">not unaware = aware<\/span>) לפני שקוראים את התשובות.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7694685566603939078", "title": "Restatement: היפוך סיבה ותוצאה", "exact": false}}, {"id": "e_rs3", "sec": "english", "type": "Restatement", "topic": "Comparison structures", "level": 2, "ans": 1, "stem": "It was not so much her talent that secured her the promotion as her willingness to take on tasks no one else wanted.", "choices": ["She was promoted mainly because she was willing to take on tasks that others avoided, rather than because of her talent.", "Both her talent and her willingness to take on unwanted tasks played an equal role in her promotion.", "Her talent, rather than her willingness to take on unwanted tasks, was the main reason she was promoted.", "She lacked talent, but her willingness to take on unwanted tasks compensated for it."], "expl": "<span dir=\"ltr\">\"not so much X as Y\"<\/span> = Y הוא הגורם העיקרי ו-X משני. כאן: הנכונות לקחת משימות, ולא הכישרון.", "why": {"3": "הופכת את ההיררכיה. זו המלכודת: X מופיע ראשון במשפט ולכן נדמה שהוא העיקר.", "2": "טוענת לתרומה שווה, אבל המבנה קובע גורם דומיננטי.", "4": "מוסיפה טענה קיצונית (<span dir=\"ltr\">lacked talent<\/span>) שלא קיימת במקור."}, "trap": [3], "tip": "<span dir=\"ltr\">not so much X as Y<\/span> = &quot;פחות X, יותר Y&quot;.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7694685566603939078", "title": "Restatement: היפוך סיבה ותוצאה", "exact": false}}, {"id": "e_rs4", "sec": "english", "type": "Restatement", "topic": "Long sentences", "level": 3, "ans": 4, "stem": "Though the negotiations had dragged on for the better part of a year, and though both delegations had, on more than one occasion, appeared on the verge of walking away from the table altogether, it was neither the mounting public pressure nor the looming deadline that ultimately forced a resolution, but rather a series of quiet, informal conversations conducted entirely outside the official proceedings.", "choices": ["Public pressure and the approaching deadline were what finally pushed the two delegations to reach an agreement after nearly a year of talks.", "The negotiations collapsed entirely after a year, once both delegations realized that no informal talks could resolve their disagreements.", "Public pressure, the looming deadline, and the informal conversations all contributed equally to bringing the negotiations to a close.", "Although the negotiations lasted almost a year and both delegations nearly abandoned them more than once, it was not public pressure or the deadline but rather informal talks held outside the official process that finally led to a resolution."], "expl": "<span dir=\"ltr\">\"neither X nor Y... but rather Z\"<\/span> = לא X ולא Y, אלא Z. תשובה (4) שומרת על כל הרכיבים: משך הזמן, כמעט-פרישה, שלילת שני הגורמים, והגורם האמיתי.", "why": {"1": "טוענת בדיוק את מה שהמשפט שולל. זו המלכודת: X ו-Y בולטים במשפט ולכן נראים כמו התשובה.", "2": "ממציאה תוצאה הפוכה (קריסה), בעוד המקור אומר <span dir=\"ltr\">\"forced a resolution\"<\/span>.", "3": "משטיחה שלילה ברורה לתרומה שווה."}, "trap": [1], "tip": "במשפט ארוך, פרקו אותו לרכיבים (רקע / מה נשלל / מה נקבע) ובדקו שהתשובה שומרת על <b>כולם<\/b>.", "fig": null, "instr": null, "video": {"url": "https://www.tiktok.com/@eilay.psychometric/video/7694685566603939078", "title": "Restatement: היפוך סיבה ותוצאה", "exact": false}}, {"id": "e_rc1", "sec": "english", "type": "Reading Comprehension", "topic": "Main idea", "level": 1, "passage": "en_bees", "ans": 2, "stem": "The main purpose of the passage is to -", "choices": ["explain why von Frisch won the Nobel Prize", "describe how bees communicate the location of food and how this was discovered", "argue that smell is more important to bees than dance", "compare the methods of beekeepers and scientists"], "expl": "הקטע כולו עוסק ב-<span dir=\"ltr\">waggle dance<\/span>: מה היא מעבירה, איך הבינו את זה, ואיך זה הוכח. פסקה (4) היא רק סיום.", "why": {"1": "הנובל מוזכר רק בפסקה האחרונה, כפרט. זו המלכודת: פרט בולט שאינו הרעיון המרכזי.", "3": "הקטע מציג את טענת הריח כעמדה שנדחתה.", "4": "אין בקטע השוואה בין שיטות."}, "trap": [1], "tip": "בשאלת <span dir=\"ltr\">main purpose<\/span>, תשובה נכונה מכסה את <b>כל<\/b> הקטע, לא פסקה אחת.", "fig": null, "instr": null, "video": null}, {"id": "e_rc2", "sec": "english", "type": "Reading Comprehension", "topic": "Detail", "level": 1, "passage": "en_bees", "ans": 4, "stem": "According to paragraph (2), the duration of the waggle run indicates -", "choices": ["the direction of the food", "the amount of food available", "the position of the sun", "the distance to the food"], "expl": "<span dir=\"ltr\">\"the duration of the run indicates its distance: the longer the waggle run, the farther away the food\"<\/span>.", "why": {"1": "הכיוון מסומן על ידי <b>הזווית<\/b>, לא האורך. זו המלכודת: שני הפרטים באותו משפט.", "2": "הקטע לא אומר דבר על כמות המזון.", "3": "השמש היא נקודת הייחוס לכיוון, לא מה שהריקוד מסמן."}, "trap": [1], "tip": "כששני פרטים מופיעים באותו משפט, סמנו בדיוק <b>מה מסמן מה<\/b>.", "fig": null, "instr": null, "video": null}, {"id": "e_rc3", "sec": "english", "type": "Reading Comprehension", "topic": "Inference", "level": 2, "passage": "en_bees", "ans": 1, "stem": "It can be inferred from paragraph (3) that the researchers who doubted von Frisch believed that -", "choices": ["the dance played little or no role in guiding other bees to the food", "bees cannot see the sun from inside the hive", "bees communicate mainly through sounds", "radar technology could not be used on insects"], "expl": "הם טענו שהדבורות פשוט &quot;הולכות אחרי הריח&quot;, כלומר שהריקוד אינו מה שמנווט אותן.", "why": {"2": "לא נטען בקטע.", "3": "קולות לא מוזכרים בקטע.", "4": "הקטע מראה דווקא שהשתמשו ברדאר. זו המלכודת: פרט מהפסקה שמשובץ הפוך."}, "trap": [4], "tip": "הסקה = מה <b>נובע<\/b> מהכתוב, צעד אחד מעבר. לא מה שאפשר לדמיין.", "fig": null, "instr": null, "video": null}, {"id": "e_rc4", "sec": "english", "type": "Reading Comprehension", "topic": "Vocabulary in context", "level": 2, "passage": "en_bees", "ans": 3, "stem": "The word \"settled\" in paragraph (3) is closest in meaning to -", "choices": ["started", "relocated", "resolved", "ignored"], "expl": "<span dir=\"ltr\">\"The debate was largely settled\"<\/span> = הוויכוח <b>הוכרע<\/b>, כלומר <span dir=\"ltr\">resolved<\/span>.", "why": {"1": "הפוך: הוויכוח הסתיים, לא התחיל.", "2": "<span dir=\"ltr\">settle<\/span> במובן &quot;התיישב במקום&quot;. זו המלכודת: המשמעות המוכרת של המילה, שלא מתאימה להקשר.", "4": "הקטע מתאר הכרעה, לא התעלמות."}, "trap": [2], "tip": "בשאלות <span dir=\"ltr\">closest in meaning<\/span>, המשמעות הנפוצה של המילה היא לרוב המסיח. הציבו כל תשובה במשפט ובדקו.", "fig": null, "instr": null, "video": null}, {"id": "e_rc5", "sec": "english", "type": "Reading Comprehension", "topic": "Inference", "level": 2, "passage": "en_bees", "ans": 2, "stem": "Which of the following statements is supported by the passage?", "choices": ["Von Frisch was the first person to notice that bees gather at the same food source.", "Evidence obtained decades after von Frisch's work helped confirm his conclusions.", "Von Frisch's theory was immediately accepted by most researchers.", "The waggle dance is performed only when food is very far away."], "expl": "פסקה (3): הוויכוח הוכרע &quot;רק עשורים מאוחר יותר&quot; בעזרת משדרי רדאר זעירים, טכנולוגיה מאוחרת שאישרה את מסקנותיו.", "why": {"1": "פסקה (1): כוורנים הבחינו בזה &quot;במשך מאות שנים&quot;. זו המלכודת.", "3": "<span dir=\"ltr\">\"not universally accepted at first\"<\/span>.", "4": "לא נאמר; אורך הריקוד משתנה לפי המרחק."}, "trap": [1], "tip": "בשאלת <span dir=\"ltr\">supported by the passage<\/span>, כל תשובה נפסלת ברגע שמילה אחת בה סותרת את הקטע.", "fig": null, "instr": null, "video": null}, {"id": "e_rc6", "sec": "english", "type": "Reading Comprehension", "topic": "Detail", "level": 2, "passage": "en_choice", "ans": 4, "stem": "According to paragraph (1), the larger display -", "choices": ["led to more purchases than the smaller one", "attracted fewer shoppers than the smaller one", "was preferred by shoppers who had clear preferences", "attracted more shoppers but resulted in proportionally fewer purchases"], "expl": "התצוגה הגדולה &quot;משכה יותר קונים לעצור&quot;, אבל רק כ-3% מהם קנו, לעומת כ-30% בתצוגה הקטנה.", "why": {"1": "הפוך מהנתונים. זו המלכודת: &quot;יותר קונים עצרו&quot; מתפרש בטעות כ&quot;יותר קנו&quot;.", "2": "סותר את <span dir=\"ltr\">\"attracted more shoppers\"<\/span>.", "3": "העדפות מוזכרות רק בפסקה (3), ולא בקשר לתצוגה."}, "trap": [1], "tip": "הבחינו בין <b>כמה עצרו<\/b> לבין <b>כמה קנו<\/b>. שאלות פרט אוהבות לבלבל בין שני מספרים.", "fig": null, "instr": null, "video": null}, {"id": "e_rc7", "sec": "english", "type": "Reading Comprehension", "topic": "Vocabulary in context", "level": 2, "passage": "en_choice", "ans": 1, "stem": "The phrase \"went further\" in paragraph (2) suggests that some writers -", "choices": ["drew conclusions more extreme than the original finding justified", "conducted additional experiments in other supermarkets", "rejected the idea of choice overload", "traveled to observe the original study"], "expl": "הכותבים לקחו את הממצא צעד רחוק יותר וטענו שצריך לצמצם את האפשרויות באופן דרסטי, מסקנה <b>קיצונית<\/b> יותר מהניסוי עצמו.", "why": {"2": "הקטע לא אומר שהם ערכו ניסויים. זו המלכודת: פירוש מילולי של further.", "3": "הפוך: הם קיבלו את הרעיון והקצינו אותו.", "4": "פירוש מילולי, לא מתאים להקשר."}, "trap": [2], "tip": "ביטויים כמו <span dir=\"ltr\">went further<\/span> הם לרוב מטפוריים. שאלו מה הם אומרים על <b>הטענה<\/b>.", "fig": null, "instr": null, "video": null}, {"id": "e_rc8", "sec": "english", "type": "Reading Comprehension", "topic": "Inference", "level": 3, "passage": "en_choice", "ans": 3, "stem": "The 2010 analysis mentioned in paragraph (3) -", "choices": ["proved that choice overload never occurs", "showed that choice overload is a universal phenomenon", "found that the effect of the number of options depends on the circumstances", "repeated the jam study with larger displays"], "expl": "בממוצע לא נמצאה השפעה, אבל העומס <b>כן הופיע<\/b> בתנאים מסוימים. כלומר, ההשפעה תלויה בנסיבות.", "why": {"1": "<span dir=\"ltr\">virtually no effect<\/span> בממוצע ≠ &quot;אף פעם&quot;. הקטע אומר במפורש שהעומס הופיע בחלק מהמחקרים. זו המלכודת.", "2": "הפוך: הוא הופיע רק בתנאים מסוימים.", "4": "הניתוח <b>שילב<\/b> ניסויים קיימים, ולא חזר על ניסוי הריבות."}, "trap": [1], "tip": "היזהרו ממילים מוחלטות (<span dir=\"ltr\">never, always, all<\/span>). בטקסטים אקדמיים התשובה הנכונה היא לרוב המסויגת.", "fig": null, "instr": null, "video": null}, {"id": "e_rc9", "sec": "english", "type": "Reading Comprehension", "topic": "Author's attitude", "level": 3, "passage": "en_choice", "ans": 2, "stem": "The author's attitude toward the original jam study can best be described as -", "choices": ["dismissive", "balanced: the study is valid, but its conclusions should be limited", "uncritically enthusiastic", "openly hostile"], "expl": "פסקה (4): <span dir=\"ltr\">\"This does not mean that the original study was flawed\"<\/span>, ובכל זאת השאלה היא &quot;מתי ולמי&quot;. הכותב מכבד את המחקר ומגביל את ההכללה ממנו.", "why": {"1": "פסקה (3) מסייגת את הממצא, אבל פסקה (4) אומרת במפורש שהמחקר לא פגום. זו המלכודת: מי שעוצר בפסקה (3).", "3": "הכותב מציג גם את הביקורת.", "4": "אין בקטע עוינות."}, "trap": [1], "tip": "בשאלות עמדה, <b>הפסקה האחרונה<\/b> היא לרוב המקום שבו הכותב אומר מה הוא באמת חושב.", "fig": null, "instr": null, "video": null}, {"id": "e_rc10", "sec": "english", "type": "Reading Comprehension", "topic": "Application", "level": 3, "passage": "en_choice", "ans": 4, "stem": "With which of the following statements would the author most likely agree?", "choices": ["Supermarkets should always offer as few products as possible.", "People with clear preferences suffer most from choice overload.", "The number of options never influences people's decisions.", "Having many options is more likely to be a burden when the options are hard to compare."], "expl": "פסקה (3): העומס הופיע בעיקר &quot;כשהאפשרויות היו קשות להשוואה&quot;.", "why": {"1": "זו העמדה הקיצונית של &quot;הכותבים שהרחיקו לכת&quot;, לא של המחבר.", "2": "הפוך: העומס הופיע אצל מי <b>שלא<\/b> היו לו העדפות ברורות. זו המלכודת.", "3": "מילה מוחלטת (<span dir=\"ltr\">never<\/span>) שסותרת את הקטע."}, "trap": [2], "tip": "בדקו מי אומר מה: עמדת <b>המחבר<\/b> שונה לפעמים מעמדות שהוא רק מצטט.", "fig": null, "instr": null, "video": null}]}], "passages": {"chart_museums": {"lang": "he g": "he", "title": "קטע קריאה — על השכחה", "html": "\n<div class=\"passage-title\">קראו את הקטע שלהלן וענו על השאלות שאחריו.<\/div>\n<p><span class=\"pn\">(1)<\/span> במשך שנים רבות נתפסה השכחה ככישלון של הזיכרון: מידע שנקלט במוח אמור להישמר בו, וכל פריט שאבד נחשב לתקלה. גישה זו נשענה במידה רבה על מחקריו של הרמן אבינגהאוס, שבסוף המאה ה-19 שינן רשימות של הברות חסרות משמעות ומדד כמה מהן הוא זוכר לאחר פרקי זמן שונים. אבינגהאוס מצא כי רוב החומר נשכח כבר בשעות הראשונות שלאחר הלמידה, ולאחר מכן קצב השכחה הולך ופוחת.<\/p>\n<p><span class=\"pn\">(2)<\/span> ואולם בעשורים האחרונים מצטברות עדויות לכך שהשכחה אינה רק תוצר לוואי של מגבלות המוח, אלא גם תהליך פעיל, שהמוח מבצע ביודעין, כביכול. במחקרים על בעלי חיים נמצא כי תאי עצב מסוימים פועלים להחלשת קשרים בין תאים אחרים, וכי כאשר פעילותם נחסמת, בעלי החיים זוכרים יותר — אך מתקשים להסתגל כאשר תנאי הסביבה משתנים. עכבר שלמד היכן מוסתר מזון ואינו מסוגל לשכוח זאת, ימשיך לחפש במקום הישן גם לאחר שהמזון הועבר.<\/p>\n<p><span class=\"pn\">(3)<\/span> לפי גישה זו, תפקידו של הזיכרון אינו לשמר את העבר במדויק, אלא לסייע לקבל החלטות טובות בהווה. זיכרון שאינו משכיח דבר היה מעמיס על בעליו פרטים רבים חסרי חשיבות, ומקשה עליו להבחין בין העיקר לטפל. השכחה מאפשרת למוח &quot;לנקות&quot; פרטים שוליים ולשמור על התבנית הכללית, וכך להכליל מניסיון העבר אל מצבים חדשים.<\/p>\n<p><span class=\"pn\">(4)<\/span> אין פירוש הדבר שכל שכחה רצויה. מחלות כמו אלצהיימר פוגעות דווקא ביכולת לשמר מידע חיוני, ואיש אינו מציע לראות בהן מנגנון מועיל. החוקרים מדגישים כי ההבחנה החשובה אינה בין זיכרון לשכחה, אלא בין שכחה סלקטיבית, המותאמת לצורכי הפרט, לבין אובדן מידע גורף ובלתי מבוקר.<\/p>"}, "en_bees": {"lang": "en", "title": "Reading Passage I", "html": "\n<div class=\"passage-title\">Read the passage below and answer the questions that follow.<\/div>\n<p><span class=\"pn\">(1)<\/span> For centuries, beekeepers noticed that when a single bee discovered a rich source of food, many others from the same hive soon appeared at the same spot. How the bees managed to share this information, however, remained a mystery until the work of the Austrian scientist Karl von Frisch in the mid-twentieth century.<\/p>\n<p><span class=\"pn\">(2)<\/span> Von Frisch observed that a forager returning to the hive often performs a peculiar series of movements on the vertical surface of the honeycomb, which he called the \"waggle dance.\" The bee runs in a straight line while shaking its body from side to side, then circles back and repeats the run. Von Frisch discovered that the angle of the straight run relative to the vertical indicates the direction of the food relative to the sun, while the duration of the run indicates its distance: the longer the waggle run, the farther away the food.<\/p>\n<p><span class=\"pn\">(3)<\/span> Von Frisch's conclusions were not universally accepted at first. Some researchers argued that the other bees were simply following the smell of the food carried on the dancer's body. The debate was largely settled only decades later, when scientists attached tiny radar transponders to individual bees and showed that newly recruited bees flew in the direction indicated by the dance.<\/p>\n<p><span class=\"pn\">(4)<\/span> In 1973, von Frisch shared the Nobel Prize in Physiology or Medicine for his discoveries — a rare honor for research on insect behavior.<\/p>"}, "en_choice": {"lang": "en", "title": "Reading Passage II", "html": "\n<div class=\"passage-title\">Read the passage below and answer the questions that follow.<\/div>\n<p><span class=\"pn\">(1)<\/span> It is commonly assumed that the more options people have, the better off they are. Yet in a well-known study published in 2000, psychologists Sheena Iyengar and Mark Lepper set up a tasting booth in a supermarket that displayed either 24 or 6 varieties of jam. While the larger display attracted more shoppers to stop and taste, only about 3 percent of those shoppers went on to buy a jar, compared with about 30 percent of those who saw the smaller display.<\/p>\n<p><span class=\"pn\">(2)<\/span> The finding was widely publicized as evidence of \"choice overload\": when faced with too many alternatives, people may find the decision so demanding that they prefer to avoid it altogether. Some writers went further, claiming that modern consumers would be happier if their options were drastically reduced.<\/p>\n<p><span class=\"pn\">(3)<\/span> Subsequent research, however, has painted a more complicated picture. A 2010 analysis that combined the results of dozens of similar experiments found that, on average, the number of options had virtually no effect on people's willingness to choose. Choice overload did appear in some studies, but chiefly under particular conditions — for instance, when people had no clear preferences in advance, or when the options were difficult to compare.<\/p>\n<p><span class=\"pn\">(4)<\/span> This does not mean that the original study was flawed. Rather, it suggests that the question is not whether choice is good or bad, but when, and for whom, a large number of options becomes a burden.<\/p>"}}, "version": "36c086"};

function interp(points, x) {
  if (x <= points[0][0]) return points[0][1];
  for (let i = 1; i < points.length; i++) if (x <= points[i][0]) {
    const [x0, y0] = points[i - 1], [x1, y1] = points[i];
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return points[points.length - 1][1];
}

function reveal() {
  if (!('IntersectionObserver' in window)) return;
  revealObs?.disconnect();
  revealObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealObs.unobserve(e.target); } }), {rootMargin: '0px 0px -8% 0px'});
  const els = document.querySelectorAll('#app .card, #app .hero');
  if (document.visibilityState !== 'visible') return; // לשונית ברקע: בלי אנימציה, הכול גלוי
  els.forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top < window.innerHeight * .92) return;  // מה שכבר על המסך מוצג מיד
    el.classList.add('reveal'); revealObs.observe(el);
  });

  const lo = Math.max(200, Math.floor((Math.min(...vals) - 30) / 50) * 50), hi = Math.min(800, Math.ceil((Math.max(...vals) + 20) / 50) * 50);
  const X = i => x0 + (x1 - x0) * i / (J.length - 1), Y = v => y0 - (y0 - y1) * (v - lo) / (hi - lo);
  let g = '';
  for (let v = lo; v <= hi; v += 50) g += `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${x0 - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
  if (you) g += `<line x1="${x0}" x2="${x1}" y1="${Y(you)}" y2="${Y(you)}" stroke="var(--good-ink)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="${x1}" y="${Y(you) + (Y(you) > y0 - 20 ? -7 : 17)}" font-size="13" font-weight="800" fill="var(--good-ink)" text-anchor="end">הציון שלך היום: ${you}</text>`;
  const pts = J.map((j, i) => j.s == null ? null : [X(i), Y(j.s), j, i]).filter(Boolean);
  g += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  J.forEach((j, i) => { g += `<text x="${X(i)}" y="${y0 + 20}" text-anchor="middle" font-size="12" fill="var(--muted)">${i + 1}</text>`; });
  pts.forEach(([x, y, j, i]) => {
    const last = i === J.length - 1;
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${last ? 7 : 5}" fill="${last ? 'var(--good)' : 'var(--accent)'}" stroke="#fff" stroke-width="2"><title>ניסיון ${i + 1}${j.d ? ' · ' + j.d : ''}: ${j.s}</title></circle>
      <text x="${x.toFixed(1)}" y="${(y - 12).toFixed(1)}" text-anchor="middle" font-size="${last ? 15 : 12}" font-weight="${last ? 800 : 600}" fill="var(--ink)">${j.s}</text>`;
  });
  g += `<text x="${(x0 + x1) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">מספר ניסיון</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="שמונת הניסיונות של ${esc(CONFIG.teacherName)} בפסיכומטרי">${g}</svg>`;
}

/* ───────────────────────── ציונים ─────────────────────────
   הערכה בלבד: אחוז תשובות נכונות -> ציון תחום 50–150 (ממוצע ארצי ~100),
   ממוצע משוקלל -> ציון כללי 200–800. רב-תחומי: מילולי 40%, כמותי 40%, אנגלית 20%. */
const DOMAIN_MAP = [[0, 50], [.25, 62], [.35, 75], [.5, 93], [.6, 105], [.7, 116], [.8, 127], [.9, 139], [1, 150]];
const GENERAL_MAP = [[50, 200], [60, 265], [70, 330], [80, 400], [90, 465], [100, 530], [110, 590], [120, 650], [130, 705], [140, 755], [150, 800]];
const domainScore = p => Math.round(interp(DOMAIN_MAP, p));
const generalScore = w => Math.round(interp(GENERAL_MAP, w));
const essay150 = total => Math.round(50 + (total - 2) * 10);
function generals(d) { // d = {verbal, quant, english}
  return {multi: generalScore((2 * d.verbal + 2 * d.quant + d.english) / 5), bi: generalScore((d.verbal + d.quant) / 2)};
}

/* ───────────────────────── הערכת חיבור (גסה) ───────────────────────── */
const CONNECTORS = {
  ניגוד: ['אולם', 'אך ', 'אבל', 'עם זאת', 'לעומת זאת', 'מנגד', 'אף על פי', 'אף-על-פי', 'למרות', 'ברם', 'מצד שני', 'מן הצד השני', 'אמנם', 'בניגוד'],
  סיבה: ['משום ש', 'מכיוון ש', 'מפני ש', 'בשל ', 'בגלל', 'לכן', 'לפיכך', 'על כן', 'כתוצאה', 'הואיל', 'היות ש', 'מאחר ש', 'עקב'],
  תוספת: ['בנוסף', 'יתרה מזאת', 'יתר על כן', 'זאת ועוד', 'כמו כן', 'נוסף על כך', 'אף ', 'גם '],
  דוגמה: ['לדוגמה', 'לדוגמא', 'למשל', 'כגון', 'כך למשל', 'דוגמה לכך'],
  סיכום: ['לסיכום', 'לסיכומו של דבר', 'לאור זאת', 'לאור האמור', 'לאור כל זאת', 'מכאן ש', 'אשר על כן', 'בסופו של דבר'],
  מבנה: ['ראשית', 'שנית', 'שלישית', 'לבסוף', 'בראש ובראשונה', 'מעבר לכך'],
};
const INFORMAL = /(כאילו|סבבה|וואלה|אחלה|יאללה|חבל"ז|תכלס|באסה|מגניב|בקיצור|ממש ממש|lol|xd|!!|\?\?|😂|🙂|😅)/gi;
function estimateEssay(text, prompt) {
  const clean = (text || '').trim();
  const words = clean.split(/\s+/).filter(w => w.replace(/[^\p{L}\p{N}]/gu, '').length);
  const W = words.length;
  const paras = clean.split(/\n+/).map(s => s.trim()).filter(s => s.split(/\s+/).length >= 8);
  const sents = clean.split(/[.!?؟:;\n]+/).map(s => s.trim()).filter(s => s.split(/\s+/).length >= 3);
  const avgSent = sents.length ? W / sents.length : W;
  const has = (list, s = clean) => list.filter(c => s.includes(c));
  const conn = {}; let distinct = new Set();
  for (const [cat, list] of Object.entries(CONNECTORS)) { const f = has(list); conn[cat] = f.length; f.forEach(x => distinct.add(x.trim())); }
  const cats = Object.values(conn).filter(x => x > 0).length;
  const norm = words.slice(0, 250).map(w => w.replace(/[^\p{L}]/gu, ''));
  const ttr = norm.length ? new Set(norm).size / norm.length : 0;
  const longRatio = W ? words.filter(w => w.replace(/[^\p{L}]/gu, '').length >= 6).length / W : 0;
  const commas = (clean.match(/,/g) || []).length / Math.max(1, sents.length);
  const keys = (prompt?.keys || []).filter(k => clean.includes(k)).length;
  const opinion = /לדעתי|לטעמי|לעניות דעתי|אני (סבור|סבורה|חושב|חושבת|מאמין|מאמינה|תומך|תומכת|מתנגד|מתנגדת)|עמדתי|נראה לי|אני משוכנע|אני משוכנעת/.test(clean);
  const counter = /מנגד|יש הטוענים|יש שיטענו|יש אנשים ש|יש מי ש|אחרים טוענים|אחרים סבורים|המתנגדים|התומכים|אמנם|מצד שני|מן הצד השני|לעומת זאת|עם זאת|אף על פי/.test(clean);
  const example = /לדוגמה|לדוגמא|למשל|כגון|דוגמה לכך|מקרה ש|כך למשל/.test(clean);
  const last = paras[paras.length - 1] || '';
  const conclusion = paras.length >= 2 && /לסיכום|לסיכומו|לאור|מכאן|על כן|לכן|בסופו של דבר|אשר על כן|לסיום/.test(last);
  const informal = (clean.match(INFORMAL) || []).length;

  let c = 0;
  c += keys >= 5 ? 1.5 : keys >= 3 ? 1 : keys >= 1 ? .4 : 0;
  c += opinion ? 1 : 0;
  c += paras.length >= 4 ? 1.5 : paras.length >= 3 ? 1 : paras.length >= 2 ? .4 : 0;
  c += example ? .75 : 0;
  c += counter ? 1 : 0;
  c += conclusion ? .75 : 0;
  c += conn['סיבה'] >= 2 ? .5 : 0;
  let content = 1 + c * 5 / 7;
  let l = 0;
  l += distinct.size >= 8 ? 2 : distinct.size >= 5 ? 1.5 : distinct.size >= 3 ? 1 : distinct.size >= 1 ? .5 : 0;
  l += cats >= 4 ? 1 : cats >= 3 ? .6 : 0;
  l += ttr >= .68 ? 1.5 : ttr >= .6 ? 1 : ttr >= .5 ? .5 : 0;
  l += avgSent >= 9 && avgSent <= 28 ? 1 : avgSent >= 6 && avgSent <= 36 ? .5 : 0;
  l += commas >= .6 ? .5 : 0;
  l += longRatio >= .25 ? 1 : longRatio >= .18 ? .5 : 0;
  l -= Math.min(2, informal * .75);
  let language = 1 + l * 5 / 7;
  // חיבור קצר אינו מפותח מספיק: תקרה לפי אורך
  const cap = W < 60 ? 1 : W < 120 ? 2 : W < 180 ? 3 : W < 250 ? 4 : W < 300 ? 5 : 6;
  if (keys < 2 && W >= 60) content = Math.min(content, 2.4); // כנראה לא עונה על הנושא
  content = Math.round(clamp(Math.min(content, cap), 1, 6));
  language = Math.round(clamp(Math.min(language, cap), 1, 6));

  const tips = [];
  if (W < 280) tips.push({k: 'length', t: W < 150 ? 'החיבור קצר מדי (' + W + ' מילים). חיבור טוב בבחינה הוא בדרך כלל 300–450 מילים: זה המקום לפתח טיעונים.' : 'כדאי להאריך ל-300 מילים לפחות (כרגע ' + W + '): פיתוח של עוד טיעון או דוגמה יעלה את הציון.'});
  if (keys < 3) tips.push({k: 'topic', t: 'לא ברור מספיק שהחיבור עונה ישירות על השאלה שנשאלה. הזכירו את הנושא במפורש בפתיחה ובכל פסקה.'});
  if (!opinion) tips.push({k: 'opinion', t: 'חסרה עמדה ברורה. כתבו בפסקת הפתיחה מה אתם חושבים (&quot;לדעתי...&quot;) והחזיקו בה עד הסוף.'});
  if (paras.length < 3) tips.push({k: 'structure', t: 'חסר מבנה של פסקאות: פתיחה, 2–3 פסקאות טיעון, וסיכום. הבודקים מתייחסים למבנה כחלק מממד התוכן.'});
  if (!counter) tips.push({k: 'counter', t: 'אין התייחסות לעמדה הנגדית. חיבור ברמה גבוהה מציג את הצד השני ומפריך אותו.'});
  if (!example) tips.push({k: 'example', t: 'הטיעונים נשארים כלליים. הוסיפו דוגמה קונקרטית לכל טיעון מרכזי.'});
  if (!conclusion && paras.length >= 2) tips.push({k: 'conclusion', t: 'חסרה פסקת סיכום שחוזרת לעמדה ומחברת את הטיעונים.'});
  if (distinct.size < 5) tips.push({k: 'connectors', t: 'מעט מילות קישור. מילים כמו &quot;יתרה מזאת&quot;, &quot;לעומת זאת&quot;, &quot;לפיכך&quot; משפרות את ממד הלשון ואת הרצף הלוגי.'});
  if (informal) tips.push({k: 'register', t: 'יש ביטויים מהשפה המדוברת. בחיבור נדרשת לשון תקנית ורשמית.'});
  if (avgSent > 34) tips.push({k: 'sent', t: 'המשפטים ארוכים מאוד. פצלו משפטים ארוכים כדי לשמור על בהירות.'});
  if (ttr < .55 && W > 120) tips.push({k: 'vocab', t: 'יש חזרה על אותן מילים. גוונו את אוצר המילים.'});
  return {content, language, total: content + language, score: essay150(content + language), W, paras: paras.length,
          sents: sents.length, avgSent: Math.round(avgSent), connectors: distinct.size, cats, ttr: Math.round(ttr * 100), keys,
          opinion, counter, example, conclusion, informal, tips};
}

/* ───────────────────────── מצב המבחן ───────────────────────── */
let S = lsGet(STORE, null);
let atHome = false, setupName = null, pane = 'q', lastPassage = null;
let view = {tab: 'student', teacher: false, record: null};
function save() { lsSet(STORE, S); }
function newState(o) {
  return {v: 1, id: 'r' + Date.now().toString(36), name: o.name, target: o.target || '', mode: o.mode, withEssay: o.withEssay, optin: !!o.optin,
          prompt: o.prompt ?? 0, phases: (o.withEssay ? ['essay'] : []).concat(SECS.map(s => s.key)),
          p: 0, stage: 'intro', qi: 0, ans: {}, t: {}, marks: {}, used: {}, essay: '', date: new Date().toISOString(), timeouts: {}};
}
const curKey = () => S.phases[S.p];
const limitSec = k => CONFIG.minutes[k] * 60;

let last = 0, ticker = null, saveCount = 0;
function startTicker() {
  stopTicker(); last = Date.now();
  ticker = setInterval(tick, 250);
}
function stopTicker() { if (ticker) clearInterval(ticker); ticker = null; }
function tick() {
  const now = Date.now(); let dt = (now - last) / 1000; last = now;
  if (!S || S.stage !== 'run') return;
  if (document.hidden && S.mode === 'untimed') dt = 0; // בלי הגבלת זמן: לשונית ברקע לא נספרת. עם זמן: הזמן רץ, כמו בבחינה
  const k = curKey();
  S.used[k] = (S.used[k] || 0) + dt;
  if (S.mode === 'timed') {
    const rem = limitSec(k) - S.used[k]; S.warned ||= {};
    for (const m of [5, 1]) if (rem <= m * 60 && rem > 0 && !S.warned[k + m]) {
      S.warned[k + m] = 1; toast(m === 5 ? '⏱️ נשארו 5 דקות לפרק' : '⏱️ נשארה דקה. כדאי לסמן תשובה בכל שאלה שנשארה');
    }
  }
  if (k !== 'essay') { const q = SEC[k].questions[S.qi]; S.t[q.id] = (S.t[q.id] || 0) + dt; }
  updateTimer();
  if (S.mode === 'timed' && S.used[k] >= limitSec(k)) { S.timeouts[k] = true; finishPhase(); return; }
  if (++saveCount % 8 === 0) save();
}
function updateTimer() {
  const el = $('#timer'); if (!el) return;
  const k = curKey(), used = S.used[k] || 0;
  if (S.mode === 'timed') {
    const rem = limitSec(k) - used;
    el.textContent = fmtTime(rem);
    el.classList.toggle('low', rem < 180);
  } else {
    el.textContent = 'זמן שעבר: ' + fmtTime(used);
  }
}

/* ───────────────────────── מסכים ───────────────────────── */
function render() {
  const app = $('#app');
  document.body.classList.toggle('testing', !!(S && S.stage === 'run' && !view.teacher && !atHome));
  $('#a11y-btn')?.classList.remove('has-sticky');
  if (view.teacher) { stopTicker(); app.innerHTML = view.record ? renderReport(view.record, true) : renderTeacherHome(); afterRender(); return; }
  if (setupName && !S) { stopTicker(); app.innerHTML = renderSetup(); window.scrollTo(0, 0); return; }
  if (!S || atHome) { stopTicker(); app.innerHTML = renderHome(); reveal(); startHello(); return; }
  if (S.stage === 'done') { stopTicker(); const r = lsGet(HIST, []).find(x => x.id === S.id) || buildRecord(); app.innerHTML = renderReport(r, false); afterRender(); return; }
  if (S.stage === 'intro') { stopTicker(); app.innerHTML = renderIntro(); window.scrollTo(0, 0); return; }
  if (S.stage === 'run') {
    const key = S.p + ':' + S.qi, same = key === lastView, y = window.scrollY;
    if (!same && curKey() !== 'essay') {
      const q = SEC[curKey()].questions[S.qi];
      pane = q.passage && q.passage !== lastPassage ? 'p' : 'q';  // בטלפון: קטע חדש נפתח קודם על הקטע
      lastPassage = q.passage || null;
    }
    const oldPas = $('.passage'), pasId = oldPas?.dataset.p, pasTop = oldPas?.scrollTop || 0;
    app.innerHTML = curKey() === 'essay' ? renderEssay() : renderQuestion();
    if (!ticker) startTicker();
    updateTimer();
    const np = $('.passage'); if (np && np.dataset.p === pasId) np.scrollTop = pasTop;
    const qn = $('.qn.cur'), bar = $('.qnums');
    if (qn && bar) bar.scrollLeft = qn.offsetLeft - bar.clientWidth / 2;
    const ta = $('#essay'); if (ta && !same) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    window.scrollTo(0, same ? y : 0);
    lastView = key;
  }
}

function renderHome() {
  const mins = s => CONFIG.minutes[s.key];
  const secRows = SECS.map(s => `<div class="secline"><span><span class="dot" style="background:${COLORS[s.key]}"></span><b>${s.name}</b></span><span class="sub">${s.questions.length} שאלות · ${mins(s)} דק׳</span></div>`).join('');
  const total = Math.round(SECS.reduce((t, s) => t + mins(s), 0) / 5) * 5;
  const inProgress = S && S.stage !== 'done';
  const resume = inProgress ? `<div class="card resume stack"><h3>יש לך מבחן שמור</h3>
      <p class="sub">${esc(S.name)}, עצרת ב${S.phases[S.p] === 'essay' ? 'מטלת הכתיבה' : SEC[S.phases[S.p]].the}. אפשר להמשיך בדיוק מאותה נקודה.</p>
      <div class="row"><button class="btn primary" data-act="resume">להמשיך את המבחן ←</button><button class="btn" data-act="restart">להתחיל מחדש</button></div></div>` : '';
  return `${brandBar()}<div class="wrap">

function buildRecord() {

/* ───────────────────────── ניתוח ───────────────────────── */
function analyze(r) {
  const out = {sections: {}, r};
  const realSec = CONFIG.realMinutes * 60;
  for (const s of SECS) {
    const qs = s.questions, n = qs.length, target = realSec / n;
    const items = qs.map((q, i) => {
      const a = r.ans[q.id] || 0, t = r.t[q.id] || 0;
      const st = !a ? 's' : a === q.ans ? 'c' : (q.trap || []).includes(a) ? 't' : 'w';
      return {q, i, a, t, st, ok: st === 'c', fast: a && st !== 'c' && t < target * .4, slow: t > target * 2.2};
    });
    const c = items.filter(x => x.ok).length, skipped = items.filter(x => x.st === 's').length;
    const wrongs = items.filter(x => !x.ok && x.a), traps = items.filter(x => x.st === 't').length;
    const byType = {}, byLevel = {1: {n: 0, c: 0}, 2: {n: 0, c: 0}, 3: {n: 0, c: 0}};
    for (const x of items) {
      (byType[x.q.type] ||= {n: 0, c: 0, lost: []}).n++;
      byLevel[x.q.level].n++;
      if (x.ok) { byType[x.q.type].c++; byLevel[x.q.level].c++; } else byType[x.q.type].lost.push(x);
    }
    let cum = 0, cutoff = n;
    const cumArr = items.map((x, i) => { cum += x.t; if (cum > realSec && cutoff === n) cutoff = i; return cum; });
    const used = r.used[s.key] || cum;
    const inTime = items.filter(x => x.i < cutoff && x.ok).length;
    const estTimedPct = (inTime + .25 * (n - cutoff)) / n;
    const easyFix = items.filter(x => x.a && !x.ok && x.q.level <= 2).length; // רק טעויות, לא דילוגים
    out.sections[s.key] = {s, items, n, c, skipped, answered: n - skipped, wrong: wrongs.length, traps, fast: items.filter(x => x.fast).length,
      slow: items.filter(x => x.slow).length, byType, byLevel, cum: cumArr, used, cutoff, target,
      pct: c / n, score: domainScore(c / n), timedScore: domainScore(Math.min(c / n, estTimedPct)),
      potential: domainScore((c + .7 * easyFix) / n), easyFix};
  }
  // חיבור
  if (r.essay) {
    const est = estimateEssay(r.essay.text, ESSAY_PROMPTS[r.essay.prompt]);
    const human = r.human && r.human.content ? {content: +r.human.content, language: +r.human.language} : null;
    const used = human ? {...human, total: human.content + human.language} : est;
    out.essay = {est, human, final: {content: used.content, language: used.language, total: used.content + used.language, score: essay150(used.content + used.language)}};
  }
  const V = out.sections.verbal, Q = out.sections.quant, E = out.sections.english;
  const withEssay = (mc) => out.essay ? Math.round(.75 * mc + .25 * out.essay.final.score) : mc;
  const pack = (pick) => ({verbal: withEssay(pick(V)), quant: pick(Q), english: pick(E)});
  out.dom = pack(x => x.score);
  out.domTimed = pack(x => x.timedScore);
  out.domPot = pack(x => x.potential);
  out.gen = generals(out.dom);
  out.genTimed = generals(out.domTimed);
  const rawPot = generals(out.domPot);
  out.genPot = {multi: Math.min(rawPot.multi, out.gen.multi + 120), bi: Math.min(rawPot.bi, out.gen.bi + 120)}; // בלי קפיצות לא אמינות
  out.partial = Object.values(out.sections).filter(A => A.answered / A.n < .5).map(A => A.s);
  if (out.partial.length) out.genPot = {...out.gen};
  // איפה הנקודות: כמה נקודות בציון הכללי שווה תיקון של כל סוג שאלה
  const gaps = [];
  for (const k of ['verbal', 'quant', 'english']) {
    const A = out.sections[k];
    for (const [type, v] of Object.entries(A.byType)) {
      if (!v.lost.length) continue;
      const d = {...out.dom};
      const mc = domainScore((A.c + v.lost.length) / A.n);
      d[k] = k === 'verbal' ? withEssay(mc) : mc;
      gaps.push({sec: k, type, lost: v.lost.length, n: v.n, c: v.c, pct: v.c / v.n, gain: generals(d).multi - out.gen.multi,
                 easy: v.lost.filter(x => x.q.level <= 2).length, traps: v.lost.filter(x => x.st === 't').length});
    }
  }
  gaps.sort((a, b) => b.gain - a.gain || b.easy - a.easy);
  out.gaps = gaps;
  out.strengths = [];
  for (const k of ['verbal', 'quant', 'english']) for (const [type, v] of Object.entries(out.sections[k].byType))
    if (v.n >= 2 && v.c / v.n >= .75) out.strengths.push({sec: k, type, pct: v.c / v.n, c: v.c, n: v.n});
  out.strengths.sort((a, b) => b.pct - a.pct);
  out.totals = {n: 0, c: 0, traps: 0, wrong: 0, fast: 0, skipped: 0, overTime: 0};
  for (const A of Object.values(out.sections)) {
    out.totals.n += A.n; out.totals.c += A.c; out.totals.traps += A.traps; out.totals.wrong += A.wrong; out.totals.fast += A.fast; out.totals.skipped += A.skipped;
    if (A.used > CONFIG.realMinutes * 60 + 5) out.totals.overTime++;
  }
  return out;
}

function insightsFor(A) {
  const L = [], key = A.s.key, n = A.n, real = CONFIG.realMinutes * 60;
  const lv = A.byLevel, e = lv[1], m = lv[2], h = lv[3];
  if (e.n && e.c / e.n < .75) L.push({c: 'bad', t: 'טעויות בשאלות הקלות', d: `${e.n - e.c} מתוך ${e.n} שאלות קלות שגויות. זה הכי משתלם לתקן: בדרך כלל זו בעיית דיוק או פער בסיסי, לא תקרת יכולת.`});
  else if (e.n) L.push({c: 'good', t: 'בסיס יציב', d: `${e.c}/${e.n} בשאלות הקלות.`});
  if (m.n && h.n && m.c / m.n >= .6 && h.c / h.n < .4) L.push({c: 'info', t: 'התקרה כרגע: שאלות קשות', d: `בינוניות ${m.c}/${m.n}, קשות ${h.c}/${h.n}. כדי לעלות שלב צריך כלים מתקדמים ושיטות קיצור.`});
  if (m.n && m.c / m.n < .5) L.push({c: 'warn', t: 'קושי בשאלות ברמה בינונית', d: `${m.c}/${m.n} בבינוניות. זה טווח הנקודות המרכזי של הבחינה.`});
  if (A.wrong >= 2 && A.traps / A.wrong >= .5) L.push({c: 'warn', t: 'נופל במלכודות המתוכננות', d: `${A.traps} מתוך ${A.wrong} הטעויות הן בדיוק המסיח שנבנה כמלכודת. יש הבנה חלקית, אבל חסרה שיטת פסילה ובדיקה.`});
  if (A.fast >= 2) L.push({c: 'warn', t: 'תשובות חפוזות', d: `${A.fast} טעויות בזמן קצר מאוד (פחות מ-${Math.round(A.target * .4)} שניות). כדאי להאט ולקרוא את השאלה עד הסוף.`});
  if (A.used > real + 5) L.push({c: 'bad', t: 'חריגה מזמן הבחינה', d: `זמן עבודה: ${fmtMin(A.used)}. בבחינה האמיתית (${CONFIG.realMinutes} דק׳) היו נענות בערך ${A.cutoff} מתוך ${n} שאלות${A.cutoff < n ? ', והשאר היו ניחוש' : ''}. ציון בתנאי אמת: ~${A.timedScore} במקום ${A.score}.`});
  else if (A.used < real * .6 && A.pct < .7) L.push({c: 'info', t: 'סיים מהר, ויש מקום לבדיקה', d: `סיים ב-${fmtMin(A.used)}. יש זמן פנוי שאפשר להשקיע בבדיקת תשובות.`});
  if (A.skipped) L.push({c: 'warn', t: 'שאלות ללא תשובה', d: `${A.skipped} שאלות נשארו ריקות. אין קנס על טעות, ולכן תמיד מנחשים.`});
  if (A.slow >= 2) L.push({c: 'info', t: 'שאלות "שואבות זמן"', d: `${A.slow} שאלות לקחו יותר מפי 2 מהזמן הממוצע. צריך ללמוד מתי לוותר ולחזור.`});
  return L;
}

/* ───────────────────────── תרשימים (SVG) ───────────────────────── */
function gauge(v, min = 200, max = 800, pot = null) {
  const W = 260, H = 150, cx = 130, cy = 132, R = 108, sw = 18;
  const ang = x => Math.PI * (1 - (clamp(x, min, max) - min) / (max - min));
  const pt = (a, r = R) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  const arc = (a0, a1) => { const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `M${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`; };
  const potArc = pot && pot > v ? `<path d="${arc(ang(v), ang(pot))}" stroke="#b9b7f0" stroke-width="${sw}" fill="none"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:280px" role="img" aria-label="ציון ${v}">
    <path d="${arc(Math.PI, 0)}" stroke="var(--grid)" stroke-width="${sw}" fill="none" stroke-linecap="round"/>
    ${potArc}
    <path d="${arc(Math.PI, ang(v))}" stroke="var(--accent)" stroke-width="${sw}" fill="none" stroke-linecap="round"><title>ציון משוער ${v}</title></path>
    <text x="${cx}" y="${cy - 22}" text-anchor="middle" font-size="46" font-weight="800" fill="var(--ink)">${v}</text>
    <text x="${cx}" y="${cy}" text-anchor="middle" font-size="13" fill="var(--muted)">מתוך 800</text>
    <text x="${cx - R}" y="${cy + 16}" text-anchor="middle" font-size="12" fill="var(--muted)">200</text>
    <text x="${cx + R}" y="${cy + 16}" text-anchor="middle" font-size="12" fill="var(--muted)">800</text>
  </svg>`;
}
function domBar(v, pot, color) { // סקאלה 50–150
  const x = s => ((clamp(s, 50, 150) - 50) / 100 * 100).toFixed(1);
  return `<svg class="chart" viewBox="0 0 100 16" preserveAspectRatio="none" style="height:16px;margin:8px 0 4px;transform:scaleX(-1)">
    <rect x="0" y="4" width="100" height="8" rx="4" fill="var(--grid)"/>
    ${pot > v ? `<rect x="0" y="4" width="${x(pot)}" height="8" rx="4" fill="${color}" opacity=".28"><title>פוטנציאל ${pot}</title></rect>` : ''}
    <rect x="0" y="4" width="${x(v)}" height="8" rx="4" fill="${color}"><title>${v}</title></rect>
    <line x1="50" y1="0" x2="50" y2="16" stroke="var(--ink-2)" stroke-width=".6" stroke-dasharray="1.5 1.5"/>
  </svg><div class="muted" style="display:flex;justify-content:space-between;font-size:12px"><span>50</span><span>ממוצע ~100</span><span>150</span></div>`;
}
function typeBars(rows) { // rows: [{label, c, n, color}]
  const rowH = 30, W = 560, lw = 170, bw = W - lw - 70, H = rows.length * rowH + 8;
  let s = '';
  rows.forEach((r, i) => {
    const y = 4 + i * rowH, w = r.n ? bw * r.c / r.n : 0;
    s += `<text x="${W - 2}" y="${y + 19}" text-anchor="end" font-size="13.5" fill="var(--ink)">${esc(r.label)}</text>
      <rect x="70" y="${y + 7}" width="${bw}" height="14" rx="4" fill="var(--grid)"/>
      <rect x="${70 + bw - w}" y="${y + 7}" width="${Math.max(w, 0).toFixed(1)}" height="14" rx="4" fill="${r.color}"><title>${esc(r.label)}: ${r.c}/${r.n}</title></rect>
      <text x="60" y="${y + 19}" text-anchor="end" font-size="13" fill="var(--ink-2)" style="font-variant-numeric:tabular-nums">${r.c}/${r.n} · ${pct(r.c, r.n)}%</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="הצלחה לפי סוג שאלה">${s}</svg>`;
}
function levelChart(an) {
  const W = 520, H = 230, x0 = 40, x1 = W - 10, y0 = 190, y1 = 14, groups = [1, 2, 3], keys = ['verbal', 'quant', 'english'];
  const gw = (x1 - x0) / 3, bw = 30;
  let s = '';
  for (const v of [0, 25, 50, 75, 100]) { const y = y0 - (y0 - y1) * v / 100; s += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${x0 - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`; }
  groups.forEach((g, gi) => {
    const cx = x0 + gw * (gi + .5);
    keys.forEach((k, ki) => {
      const L = an.sections[k].byLevel[g], p = L.n ? L.c / L.n : 0, h = (y0 - y1) * p;
      const x = cx + (ki - 1) * (bw + 4) - bw / 2;
      s += `<rect x="${x}" y="${(y0 - h).toFixed(1)}" width="${bw}" height="${Math.max(h, 1).toFixed(1)}" rx="4" fill="${HEX[k]}"><title>${SEC[k].short} · ${LEVEL[g]}: ${L.c}/${L.n}</title></rect>`;
      if (L.n) s += `<text x="${x + bw / 2}" y="${(y0 - h - 5).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${Math.round(p * 100)}</text>`;
    });
    s += `<text x="${cx}" y="${y0 + 22}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${['שאלות קלות', 'בינוניות', 'קשות'][gi]}</text>`;
  });
  s += `<line x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}" stroke="var(--line-2)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="הצלחה לפי רמת קושי">${s}</svg>`;
}
function paceChart(A) {
  const W = 300, H = 190, x0 = 34, x1 = W - 10, y0 = 160, y1 = 12, n = A.n;
  const maxM = Math.max(CONFIG.realMinutes + 4, Math.ceil(A.cum[n - 1] / 60) + 1);
  const X = i => x0 + (x1 - x0) * i / n, Y = m => y0 - (y0 - y1) * m / maxM;
  let s = '';
  for (let m = 0; m <= maxM; m += 5) s += `<line x1="${x0}" x2="${x1}" y1="${Y(m)}" y2="${Y(m)}" stroke="var(--grid)"/><text x="${x0 - 5}" y="${Y(m) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${m}</text>`;
  s += `<line x1="${x0}" x2="${x1}" y1="${Y(CONFIG.realMinutes)}" y2="${Y(CONFIG.realMinutes)}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  s += `<text x="${x0 + 4}" y="${Y(CONFIG.realMinutes) - 5}" font-size="10.5" fill="var(--bad)" text-anchor="start">${CONFIG.realMinutes} דק׳ — סוף הזמן בבחינה</text>`;
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(CONFIG.realMinutes)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  const pts = [[X(0), Y(0)]].concat(A.cum.map((c, i) => [X(i + 1), Y(c / 60)]));
  s += `<polyline points="${pts.map(p => p.map(z => z.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${HEX[A.s.key]}" stroke-width="2"/>`;
  A.items.forEach((x, i) => { s += `<circle cx="${X(i + 1).toFixed(1)}" cy="${Y(A.cum[i] / 60).toFixed(1)}" r="3" fill="${HEX[A.s.key]}"><title>שאלה ${i + 1}: ${Math.round(x.t)} שנ׳ (מצטבר ${fmtTime(A.cum[i])})</title></circle>`; });
  s += `<text x="${(x0 + x1) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">מספר שאלה</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="קצב התקדמות">${s}</svg>`;
}
function qmap(A, withTitles = true) {
  return `<div class="qmap">${A.items.map(x => {
    const title = withTitles ? `שאלה ${x.i + 1} · ${x.q.type} · ${LEVEL[x.q.level]} · ${Math.round(x.t)} שנ׳` : `שאלה ${x.i + 1}`;

/* ───────────────────────── שיתוף ───────────────────────── */
async function encodeRecord(r) {
  const c = {v: 1, b: BANK.version, i: r.id, n: r.name, g: r.target, m: r.mode, d: r.date,
    a: SECS.map(s => s.questions.map(q => r.ans[q.id] || 0).join('')),
    t: SECS.map(s => s.questions.map(q => Math.round(r.t[q.id] || 0))),
    u: SECS.map(s => Math.round(r.used[s.key] || 0)),
    e: r.essay ? [r.essay.prompt, r.essay.text, Math.round(r.essay.secs), r.essay.pasted || 0] : null, o: r.optin ? 1 : 0};
  const bytes = new TextEncoder().encode(JSON.stringify(c));
  let out, tag = 'PSY0.';
  try {
    const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    out = new Uint8Array(await new Response(cs).arrayBuffer()); tag = 'PSY1.';
  } catch (e) { out = bytes; }
  let bin = ''; out.forEach(b => bin += String.fromCharCode(b));
  return tag + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function decodeRecord(code) {
  const m = String(code).match(/PSY([01])\.([A-Za-z0-9_\-]+)/);
  if (!m) throw new Error('קוד לא תקין');
  const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  let bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
  if (m[1] === '1') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  const c = JSON.parse(new TextDecoder().decode(bytes));
  if (c.b && c.b !== BANK.version) toast('שימו לב: הקוד נוצר בגרסה אחרת של המבחן');
  const r = {v: 1, id: c.i, name: c.n, target: c.g, mode: c.m, date: c.d, ans: {}, t: {}, used: {}, essay: null};
  SECS.forEach((s, si) => {
    s.questions.forEach((q, qi) => { const a = +c.a[si][qi]; if (a) r.ans[q.id] = a; r.t[q.id] = c.t[si][qi] || 0; });
    r.used[s.key] = c.u[si];
  });
  if (c.e) r.essay = {prompt: c.e[0], text: c.e[1], secs: c.e[2], pasted: c.e[3] || 0};
  r.optin = !!c.o;
